services:
  office-sign-bridge:
    build:
      context: .
      dockerfile: Dockerfile.bridge
    container_name: office-sign-bridge
    restart: unless-stopped
    env_file:
      - path: ${OFFICE_SIGN_ENV_FILE:-office-sign.env}
        required: false
    ports:
      - "${OFFICE_SIGN_BIND_IP:-127.0.0.1}:8787:8787"
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      DISPLAY_TZ: Europe/London
    networks:
      - mqtt
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/status', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      com.centurylinklabs.watchtower.enable: "false"

networks:
  mqtt:
    name: ${MQTT_NETWORK_NAME:-mosquito_default}
    external: true

name: mosquito

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    ports:
      - "1883:1883"
    volumes:
      - /volume3/docker/mosquitto/config:/mosquitto/config
      - /volume3/docker/mosquitto/data:/mosquitto/data
      - /volume3/docker/mosquitto/log:/mosquitto/log
    restart: unless-stopped

networks:
  default:
    name: ${MQTT_NETWORK_NAME:-mosquito_default}
